name: Links

on:
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - ".github/workflows/links.yml"
  pull_request:
    paths:
      - "**/*.md"
      - ".github/workflows/links.yml"
  schedule:
    - cron: "37 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: lycheeverse/lychee-action@v2
        with:
          fail: true
